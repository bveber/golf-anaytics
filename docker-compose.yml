services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      - DB_PATH=db/golf_analytics.duckdb
      - BACKUP_DIR=backups
    volumes:
      - ./db:/app/db
      - ./backups:/app/backups
      - ./.cookies:/app/.cookies
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    depends_on:
      - api
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./certs:/certs:ro
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
